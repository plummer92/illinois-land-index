name: Refresh public land data

on:
  workflow_dispatch:
  schedule:
    - cron: "23 11 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLIC_DATA_STALE_DAYS: ${{ vars.PUBLIC_DATA_STALE_DAYS || '7' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test refresh and retry handling
        run: node --test scripts/test_fetch_json.mjs scripts/test_refresh_status.mjs

      - name: Refresh public land sources independently
        run: node scripts/refresh_public_land_data.mjs

      - name: Commit refreshed data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/refresh_status.json \
            knoxville-market-dashboard/data/processed \
            indianapolis-market-dashboard/data/processed \
            gilpin-county-dashboard/data/processed
          if git diff --cached --quiet; then
            echo "No public land data changes to commit."
          else
            git commit -m "Refresh public land data"
            git push
          fi

      - name: Enforce refresh health policy
        if: always()
        run: node scripts/evaluate_refresh_status.mjs
